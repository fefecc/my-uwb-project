# UWB serial and analysis config
serial:
  tag: "COM6"
  anchor: "COM7"
  baudrate: 460800

# Default input for scripts/frame-analysis/uwb_frame_analyzer.py.
# Paths are repo-root relative by default. Absolute paths are also accepted.
# CLI behavior:
# - no args: capture serial.tag / serial.anchor, then analyze all sessions
# - with session range or explicit log inputs: analyze logs; if no paths are given, latest logs are used
frame_analysis:
  # legacy switch kept for compatibility; mode selection is now driven by CLI args.
  capture: true
  # null means capture until Ctrl+C. Use a number for timed capture, for example 60.
  capture_duration_s: null
  # true echoes serial lines to terminal while saving logs.
  show_serial: true
  # legacy path fields; CLI analysis mode now prefers latest logs when no explicit paths are passed.
  tag_log: ""
  anchor_log: ""
  logs: []
  date: ""
  twr_period_ms: null
  no_backup: false
